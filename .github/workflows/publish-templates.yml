name: Publish Standalone Templates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Lint + format check
        run: pnpm run check

      - name: Build templates (includes type check)
        run: pnpm build

      - name: List template × toolchain combinations
        id: matrix
        run: |
          MATRIX=$(jq -c '[(.toolchains | keys) as $c | .templates | keys[] as $t | $c[] | {template: $t, toolchain: .}]' templates.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.matrix) }}
    env:
      NAME: ${{ matrix.template }}-${{ matrix.toolchain }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Build standalone template
        run: |
          node scripts/create-project.js ${{ matrix.template }} ${{ matrix.toolchain }} "standalone-$NAME"
          # Remove git from generated project (will init fresh)
          rm -rf "standalone-$NAME/.git"

      - name: Verify standalone template builds
        # Build a copy so install artifacts (pnpm-lock.yaml, node_modules) never get published
        run: |
          cp -r "standalone-$NAME" "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          pnpm install
          pnpm build
          pnpm run check

      - name: Deploy to branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ env.NAME }}
          folder: standalone-${{ env.NAME }}
          clean: true
          commit-message: "Update ${{ env.NAME }} template"
