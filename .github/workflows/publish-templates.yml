name: Publish Standalone Templates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run ci

      - name: Build templates
        run: pnpm build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        template: [vanilla-js, react-js]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Build standalone template
        run: |
          node scripts/create-project.js ${{ matrix.template }} standalone-${{ matrix.template }}
          # Remove git from generated project (will init fresh)
          rm -rf standalone-${{ matrix.template }}/.git

      - name: Verify standalone template builds
        # Build a copy so install artifacts (pnpm-lock.yaml, node_modules) never get published
        run: |
          cp -r standalone-${{ matrix.template }} "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          pnpm install --ignore-workspace
          pnpm build
          pnpm run ci

      - name: Deploy to branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ matrix.template }}
          folder: standalone-${{ matrix.template }}
          clean: true
          commit-message: "Update ${{ matrix.template }} template"
